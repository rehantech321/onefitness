org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The project lives on a different drive letter (D:) than the pub cache
# (C:\Users\...\Pub\Cache) that plugin source files are compiled from.
# Kotlin's incremental compiler tries to store plugin build caches as
# paths relative to the project root, which throws (or worse, silently
# writes a corrupt cache) when the plugin source and the project have
# different drive roots on Windows — intermittently causing a *later*
# build to fail with "package ... does not exist" for whichever plugin's
# cache got corrupted (seen with flutter_native_splash, share_plus,
# image_picker_android, url_launcher_android). Disabling Kotlin
# incremental compilation avoids ever writing that relocatable cache in
# the first place, trading a bit of rebuild speed for not intermittently
# breaking the build.
kotlin.incremental=false
