# Sized to the actual machine, which has 7.9G of RAM total and routinely
# under 2G free. Earlier values (-Xmx8G, then -Xmx4G) asked for more than the
# OS could ever grant, and the daemon died mid-build with "insufficient
# memory for the Java Runtime Environment" / "daemon disappeared
# unexpectedly" — which reads like a build error but is really the JVM being
# unable to reserve its heap. A heap the OS can actually satisfy builds
# slower but succeeds; one it can't doesn't build at all.
#
# The Kotlin compile daemon is a SEPARATE JVM and is capped on its own line
# below, otherwise the two together exceed what's available even when each
# looks reasonable in isolation.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# Build on JDK 21, not whatever JAVA_HOME points at.
#
# This machine's JAVA_HOME is Temurin 25.0.2, and Gradle 8.14 embeds Kotlin
# 2.0.21 to compile .kts build scripts. That Kotlin's version parser rejects
# any Java feature release of 25 or above, so compiling settings.gradle.kts
# or app/build.gradle.kts dies with a bare
#   java.lang.IllegalArgumentException: 25.0.2
# and no other context — it reads like a corrupt SDK and is really just the
# JDK being too new for the script compiler.
#
# It hid for a while because compiled build scripts are cached: the build
# kept working on JDK 25 until something invalidated that cache, and then
# failed with no apparent cause. JDK 21 is the pairing AGP 8.11 and Gradle
# 8.14 are actually tested against.
#
# Forward slashes are required here even on Windows — Gradle reads this file
# as a java.util.Properties file, where a backslash is an escape character,
# so C:\Users\... silently resolves to a path that doesn't exist.
org.gradle.java.home=C:/Users/OTS/jdks/extract/jdk-21.0.13+9

# One worker at a time. Parallel module builds each hold their own memory,
# which is exactly the wrong trade on a RAM-constrained machine — this costs
# wall-clock time and buys back headroom.
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G

# Compile Kotlin inside the Gradle daemon instead of forking a second JVM.
#
# The Kotlin daemon above is a whole separate process with its own 1G heap,
# so the two together ask the OS for ~3G before any compilation starts. On a
# machine with well under 1G free that is what kills the build — and it dies
# as "Gradle build daemon disappeared unexpectedly", which reads like a crash
# and is really the OS refusing to back the heap.
#
# In-process means one JVM and one heap for the whole build. It is slower
# across repeated builds (no warm Kotlin daemon to reuse) and it is the same
# trade already made above for org.gradle.parallel: wall-clock time for
# headroom. Safe here because kotlin.incremental is off, so there is no
# incremental state for a daemon to hold between builds anyway.
kotlin.compiler.execution.strategy=in-process

# R8's "full mode" does deeper whole-program analysis and holds far more in
# memory during release minification. Standard mode still shrinks and
# obfuscates; it just doesn't need the extra gigabyte to do it.
android.enableR8.fullMode=false
android.useAndroidX=true

# The project lives on a different drive letter (D:) than the pub cache
# (C:\Users\...\Pub\Cache) that plugin source files are compiled from.
# Kotlin's incremental compiler tries to store plugin build caches as
# paths relative to the project root, which throws (or worse, silently
# writes a corrupt cache) when the plugin source and the project have
# different drive roots on Windows — intermittently causing a *later*
# build to fail with "package ... does not exist" for whichever plugin's
# cache got corrupted (seen with flutter_native_splash, share_plus,
# image_picker_android, url_launcher_android). Disabling Kotlin
# incremental compilation avoids ever writing that relocatable cache in
# the first place, trading a bit of rebuild speed for not intermittently
# breaking the build.
kotlin.incremental=false
